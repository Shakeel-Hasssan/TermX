<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file: data:">
  <title>TermX</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="body">
      <nav class="rail">
        <img class="rail-logo" src="../assets/icon.svg" alt="TermX" title="TermX" draggable="false">
        <button class="rail-btn active" data-panel="sessions" title="Sessions"><span data-icon="server"></span></button>
        <button class="rail-btn" data-panel="search" title="Search (Ctrl+Shift+S)"><span data-icon="search"></span></button>
        <button class="rail-btn" id="rail-grep" title="Grep: filter the active terminal (Ctrl+Shift+G)"><span data-icon="filter"></span></button>
        <button class="rail-btn" data-panel="files" title="SFTP browser"><span data-icon="folder"></span></button>
        <button class="rail-btn" data-panel="flows" title="Flows: recorded and scripted input"><span data-icon="workflow"></span></button>
        <div class="rail-fill"></div>
        <button class="rail-btn" id="btn-palette" title="Command palette (Ctrl+Shift+P)"><span data-icon="command"></span></button>
        <button class="rail-btn" id="btn-multiexec" title="Multi-exec: type into all tabs (Ctrl+Shift+M)"><span data-icon="broadcast"></span></button>
        <button class="rail-btn" id="btn-update" title="Check for updates"><span data-icon="upgrade"></span></button>
        <button class="rail-btn" data-panel="settings" title="Settings"><span data-icon="settings"></span></button>
      </nav>

      <aside class="sidebar" id="sidebar">
        <section class="panel active" data-panel="sessions">
          <div class="panel-head">
            <h2>Sessions</h2>
            <div class="head-actions">
              <button class="icon-btn" id="btn-new-folder" title="New folder"><span data-icon="folderPlus"></span></button>
              <button class="icon-btn" id="btn-import" title="Import connections from MobaXterm, PuTTY or OpenSSH"><span data-icon="download"></span></button>
              <button class="icon-btn" id="btn-new-session" title="New SSH session (Ctrl+Shift+N)"><span data-icon="plus"></span></button>
            </div>
          </div>
          <form class="quick" id="quick-form" autocomplete="off">
            <span class="quick-icon" data-icon="bolt"></span>
            <input id="quick-input" spellcheck="false" placeholder="Quick connect — user@host:port" title="Type user@host:port and press Enter">
          </form>
          <div class="search-box"><span data-icon="search"></span><input id="session-filter" placeholder="Filter sessions" spellcheck="false"></div>
          <div class="panel-scroll" id="session-list"></div>
        </section>

        <section class="panel" data-panel="search">
          <div class="panel-head"><h2>Search</h2></div>
          <div class="search-box"><span data-icon="search"></span><input id="global-search" placeholder="Terminals, sessions, flows" spellcheck="false">
            <span class="search-opts" id="search-opts"><button data-opt="case" title="Match case">Aa</button><button data-opt="regex" title="Regular expression">.*</button></span></div>
          <div class="panel-scroll" id="search-results"></div>
        </section>

        <section class="panel" data-panel="files">
          <div class="panel-head">
            <h2>SFTP</h2>
            <div class="head-actions">
              <button class="icon-btn" id="sftp-upload" title="Upload files"><span data-icon="upload"></span></button>
              <button class="icon-btn" id="sftp-mkdir" title="New folder"><span data-icon="folderPlus"></span></button>
              <button class="icon-btn" id="sftp-newfile" title="New file"><span data-icon="filePlus"></span></button>
              <button class="icon-btn" id="sftp-refresh" title="Refresh"><span data-icon="refresh"></span></button>
            </div>
          </div>
          <div class="pathbar">
            <button class="icon-btn sm" id="sftp-up" title="Parent folder"><span data-icon="arrowUp"></span></button>
            <button class="icon-btn sm" id="sftp-home" title="Home"><span data-icon="home"></span></button>
            <input id="sftp-path" spellcheck="false">
          </div>
          <div class="panel-scroll file-list" id="file-list"></div>
          <div class="transfers" id="transfers"></div>
        </section>

        <section class="panel" data-panel="flows">
          <div class="panel-head">
            <h2>Flows</h2>
            <div class="head-actions">
              <button class="icon-btn" id="btn-record-flow" title="Record a flow (Ctrl+Shift+R)"><span data-icon="record"></span></button>
              <button class="icon-btn" id="btn-new-flow" title="New flow"><span data-icon="plus"></span></button>
            </div>
          </div>
          <div class="panel-scroll" id="flow-list"></div>
        </section>
        <section class="panel" data-panel="settings">
          <div class="panel-head"><h2>Settings</h2></div>
          <div class="panel-scroll settings" id="settings"></div>
        </section>
      </aside>
      <div class="sidebar-resizer" id="sidebar-resizer"></div>

      <main class="main">
        <div class="tabbar">
          <div class="tabs" id="tabs"></div>
          <div class="new-tab">
            <button class="icon-btn" id="btn-new-tab" title="New local terminal (Ctrl+Shift+T)"><span data-icon="plus"></span></button>
            <button class="icon-btn" id="btn-shell-menu" title="Choose shell"><span data-icon="chevronDown"></span></button>
          </div>
        </div>
        <div class="stack" id="stack">
          <div class="welcome" id="welcome"></div>
        </div>
        <footer class="statusbar" id="statusbar"></footer>
      </main>
    </div>
  </div>

  <div class="overlay hidden" id="modal-root"></div>
  <datalist id="grep-history"></datalist>
  <div class="menu hidden" id="ctx-menu"></div>
  <div class="toasts" id="toasts"></div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
  <script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="icons.js"></script>
  <script src="themes.js"></script>
  <script src="app.js"></script>
</body>
</html>
